name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update application
        run: |
          set -e
          cd /opt/jurnal-trade
          git fetch origin main
          git reset --hard origin/main
          npm ci --omit=dev
          sudo -n systemctl restart jurnal-trade
          sleep 2
          sudo -n systemctl is-active --quiet jurnal-trade
          curl --fail --silent --show-error http://127.0.0.1/ > /dev/null
